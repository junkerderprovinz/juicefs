# Built from the Unraid template in junkerderprovinz/unraid-apps by
# .github/gen-compose.py. Change the template there, not this file.
#
# Folders are created next to this file on the first start. Point the ones
# that hold your own files (downloads, storage and the like) at real folders
# first, and fill in every value marked "required".

services:
  juicefs:
    image: junkerderprovinz/juicefs:latest@sha256:d26384ddc9d4a4940cc9fdac1c53a86ce284e7335653412ff23a478482798ea2
    container_name: juicefs
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - "./appdata/config:/config"
      - "./appdata/data:/data"
      - "./appdata/cache:/cache"
    environment:
      S3_ROOT_USER: juicefs
      META_URL: "sqlite3:///config/juicefs.db"
      STORAGE: file
      BUCKET: /data/
      VOLUME_NAME: juicefs
      MULTI_BUCKETS: "true"
      PUID: "1000"
      PGID: "1000"
