# Builds the amd64 and arm64 image, tags it latest and with the JUICEFS_VERSION
# pinned in the Dockerfile, and pushes it to GHCR, and to Docker Hub once the
# DOCKERHUB_USERNAME variable and the DOCKERHUB_TOKEN secret are both set.
# Renovate bumps the pinned versions.

name: Build & Push Docker Image

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if image already exists for this tag'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', 'templates/**']

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/junkerderprovinz/juicefs
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read pinned JuiceFS version from Dockerfile
        id: ver
        run: |
          TAG=$(grep -m1 '^ARG JUICEFS_VERSION=' Dockerfile | cut -d= -f2)
          if [ -z "${TAG}" ]; then echo "::error::Could not read JUICEFS_VERSION from Dockerfile"; exit 1; fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "tag_bare=${TAG#v}" >> "${GITHUB_OUTPUT}"
          echo "Pinned JuiceFS version: ${TAG}"

      - name: Check if image already exists
        id: check
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          IMAGE="${{ env.IMAGE_NAME }}:${TAG}"
          SKIP="false"
          FORCE="${{ github.event.inputs.force_rebuild }}"
          EVENT="${{ github.event_name }}"
          if [ "${EVENT}" = "push" ]; then
            SKIP="false"
          elif [ "${FORCE}" = "true" ]; then
            SKIP="false"
          elif docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
            echo "Image ${IMAGE} already exists, skipping build."
            SKIP="true"
          fi
          echo "skip=${SKIP}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.check.outputs.skip != 'true' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Compose image tags
        id: tags
        if: steps.check.outputs.skip != 'true'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TAG: ${{ steps.ver.outputs.tag }}
          TAG_BARE: ${{ steps.ver.outputs.tag_bare }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:latest"
            echo "${IMAGE_NAME}:${TAG}"
            echo "${IMAGE_NAME}:${TAG_BARE}"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              DH="docker.io/${DOCKERHUB_USERNAME}/juicefs"
              echo "${DH}:latest"
              echo "${DH}:${TAG}"
              echo "${DH}:${TAG_BARE}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # A green build only proves the image builds. The smoke test checks what
      # it promises: started with no settings it serves S3, it creates the file
      # system itself, and restarted on the same volumes it does not format
      # again, which would orphan every object in the store.
      - name: Build amd64 image for smoke test
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: juicefs:smoke-amd64
          cache-from: type=gha

      - name: "Smoke test: bare start, self-format, and no re-format on restart"
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VOL_META="$(mktemp -d)"
          VOL_DATA="$(mktemp -d)"
          cleanup() { docker logs juicefs-smoke || true; docker rm -f juicefs-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          # (1) No -e flags, like a user who installs the template and changes
          # nothing.
          docker run -d --name juicefs-smoke -p 9000:9000 \
            -v "${VOL_META}:/config" -v "${VOL_DATA}:/data" \
            juicefs:smoke-amd64

          ok=""
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000 || true)"
            case "$code" in 200|403) ok=1; break ;; esac
            sleep 2
          done
          [ -n "$ok" ] || { echo "::error::S3 gateway never answered on port 9000"; exit 1; }

          # (2) The volume must exist in the metadata engine, not just "the
          # process is running".
          docker exec juicefs-smoke juicefs status sqlite3:///config/juicefs.db \
            || { echo "::error::No file system was created"; exit 1; }

          # A generated secret key must have been written down, otherwise a
          # user who left the field empty can never authenticate.
          docker exec juicefs-smoke test -s /config/.s3_root_password \
            || { echo "::error::No generated secret key was persisted"; exit 1; }

          # Record the volume's UUID, which is the one field that changes only
          # when the volume is formatted. The rest of `juicefs status` carries
          # live session data (expiry, mount time, process id, used space) that
          # differs after every restart, so comparing the whole output would
          # fail even when nothing is wrong.
          uuid_of() {
            docker exec juicefs-smoke juicefs status sqlite3:///config/juicefs.db \
              | grep -oE '"UUID": *"[^"]+"' | head -1
          }
          BEFORE="$(uuid_of)"
          # An empty value would make the comparison below pass no matter what,
          # which is worse than a failing test.
          [ -n "${BEFORE}" ] || { echo "::error::Could not read the volume UUID"; exit 1; }
          echo "Volume UUID before the restart: ${BEFORE}"

          # (3) Restart on the same volumes. The UUID must survive; a new one
          # means the init script formatted over an existing file system.
          docker restart juicefs-smoke
          ok=""
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000 || true)"
            case "$code" in 200|403) ok=1; break ;; esac
            sleep 2
          done
          [ -n "$ok" ] || { echo "::error::Gateway did not come back after a restart"; exit 1; }

          AFTER="$(uuid_of)"
          [ -n "${AFTER}" ] || { echo "::error::Could not read the volume UUID after the restart"; exit 1; }
          echo "Volume UUID after the restart:  ${AFTER}"
          if [ "${BEFORE}" != "${AFTER}" ]; then
            echo "::error::The volume UUID changed across a restart, so it was formatted again"
            exit 1
          fi

          # The init script must say so too. Without this, a run where the
          # format step silently did nothing would still look green.
          docker logs juicefs-smoke 2>&1 | grep -q "Existing file system found" \
            || { echo "::error::The init script did not report finding the existing file system"; exit 1; }

          # (4) A real S3 round trip with the runner's AWS CLI. Creating a bucket
          # is the first thing most backup clients do, and it is refused unless
          # the gateway runs in multi-bucket mode.
          KEY="$(docker exec juicefs-smoke cat /config/.s3_root_password)"
          [ -n "${KEY}" ] || { echo "::error::No secret key to authenticate with"; exit 1; }
          export AWS_ACCESS_KEY_ID=juicefs
          export AWS_SECRET_ACCESS_KEY="${KEY}"
          export AWS_DEFAULT_REGION=us-east-1
          EP="--endpoint-url http://127.0.0.1:9000"

          aws $EP s3 mb s3://smoke \
            || { echo "::error::Could not create a bucket, so multi-bucket mode is off"; exit 1; }

          head -c 1048576 /dev/urandom > /tmp/probe.bin
          printf 'umlauts: \303\244\303\266\303\274\n' >> /tmp/probe.bin
          SENT="$(sha256sum /tmp/probe.bin | cut -d' ' -f1)"
          aws $EP s3 cp /tmp/probe.bin "s3://smoke/dir/file.bin" >/dev/null \
            || { echo "::error::Upload failed"; exit 1; }
          aws $EP s3 cp "s3://smoke/dir/file.bin" /tmp/back.bin >/dev/null \
            || { echo "::error::Download failed"; exit 1; }
          RECEIVED="$(sha256sum /tmp/back.bin | cut -d' ' -f1)"
          [ "${SENT}" = "${RECEIVED}" ] \
            || { echo "::error::The object came back different than it went in"; exit 1; }
          echo "S3 round trip intact (${SENT})"

          # (5) In a directory the service cannot write to, the read cache is
          # clamped to zero and the log gets one warning per second.
          if docker logs juicefs-smoke 2>&1 | grep -q "no such file or directory.*juicefs/cache"; then
            echo "::error::The read cache directory is not writable, the log is filling with warnings"
            exit 1
          fi
          WARN="$(docker logs juicefs-smoke 2>&1 | grep -c 'getDiskUsage' || true)"
          [ "${WARN}" -lt 5 ] \
            || { echo "::error::${WARN} cache warnings in the log, the cache path is wrong"; exit 1; }
          echo "Cache path healthy (${WARN} warnings)"

          docker rm -f juicefs-smoke >/dev/null 2>&1 || true

          # (6) A secret key below the gateway's hard minimum must fail fast
          # with one clear line, not leave a container restarting forever.
          docker run -d --name juicefs-smoke -p 9000:9000 \
            -e S3_ROOT_PASSWORD=short juicefs:smoke-amd64 >/dev/null
          sleep 12
          STATE="$(docker inspect -f '{{.State.Status}}' juicefs-smoke)"
          [ "${STATE}" = "exited" ] \
            || { echo "::error::A too-short secret key left the container ${STATE}, expected exited"; exit 1; }
          docker logs juicefs-smoke 2>&1 | grep -q "at least 8" \
            || { echo "::error::The container stopped but did not say why"; exit 1; }
          echo "Short secret key refused cleanly"

          docker rm -f juicefs-smoke >/dev/null 2>&1 || true

          # (7) A path with a space in it must not split into two arguments.
          VOL_SP="$(mktemp -d)/with space"
          mkdir -p "${VOL_SP}"
          docker run -d --name juicefs-smoke -p 9000:9000 \
            -v "${VOL_SP}:/cache-sp" -e CACHE_DIR="/cache-sp" juicefs:smoke-amd64 >/dev/null
          ok=""
          for i in $(seq 1 45); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000 || true)"
            case "$code" in 200|403) ok=1; break ;; esac
            sleep 2
          done
          [ -n "$ok" ] || { echo "::error::A cache path broke the gateway's command line"; docker logs juicefs-smoke | tail -5; exit 1; }
          echo "Quoted paths survive"

          echo "Smoke test passed."

      # (8) arm64 is published too. A full round trip under QEMU would take far
      # too long, so this checks what differs between architectures: that the
      # binary runs and the service comes up.
      - name: Build arm64 image for a start check
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: juicefs:smoke-arm64
          cache-from: type=gha

      - name: Start check on arm64
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cleanup() { docker logs juicefs-arm64 || true; docker rm -f juicefs-arm64 >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name juicefs-arm64 -p 9100:9000 juicefs:smoke-arm64
          ok=""
          for i in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9100 || true)"
            case "$code" in 200|403) ok=1; break ;; esac
            sleep 2
          done
          [ -n "$ok" ] || { echo "::error::The arm64 image never came up"; exit 1; }
          docker exec juicefs-arm64 juicefs status sqlite3:///config/juicefs.db >/dev/null \
            || { echo "::error::arm64 came up but created no file system"; exit 1; }
          echo "arm64 starts and creates its file system."

      - name: Stamp the build time
        id: stamp
        run: echo "now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: Build and push multi-arch image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # The commit and build time are only known here, not in the
          # Dockerfile, and the revision label traces a published image back to
          # its source.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.stamp.outputs.now }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
