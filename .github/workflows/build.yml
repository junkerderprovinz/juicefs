# =============================================================================
# build.yml — JuiceFS Docker Image Build & Push
#
# Triggers: push to main, workflow_dispatch. Output: multi-arch image
# (linux/amd64, linux/arm64) pushed to ghcr.io/junkerderprovinz/juicefs — and,
# once DOCKERHUB_USERNAME (variable) + DOCKERHUB_TOKEN (secret) are set
# together, mirrored to docker.io/<DOCKERHUB_USERNAME>/juicefs — tagged
# :latest and the pinned JUICEFS_VERSION Dockerfile ARG.
#
# Component versions (JuiceFS, s6-overlay) are pinned in the Dockerfile ARGs,
# tracked by Renovate — not resolved dynamically here. The JuiceFS binary is
# additionally checked against the SHA256 from the upstream release, so a
# re-tagged release fails the build instead of shipping.
# =============================================================================

name: Build & Push Docker Image

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if image already exists for this tag'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', 'templates/**']

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/junkerderprovinz/juicefs
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read pinned JuiceFS version from Dockerfile
        id: ver
        run: |
          TAG=$(grep -m1 '^ARG JUICEFS_VERSION=' Dockerfile | cut -d= -f2)
          if [ -z "${TAG}" ]; then echo "::error::Could not read JUICEFS_VERSION from Dockerfile"; exit 1; fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "tag_bare=${TAG#v}" >> "${GITHUB_OUTPUT}"
          echo "Pinned JuiceFS version: ${TAG}"

      - name: Check if image already exists
        id: check
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          IMAGE="${{ env.IMAGE_NAME }}:${TAG}"
          SKIP="false"
          FORCE="${{ github.event.inputs.force_rebuild }}"
          EVENT="${{ github.event_name }}"
          if [ "${EVENT}" = "push" ]; then
            SKIP="false"
          elif [ "${FORCE}" = "true" ]; then
            SKIP="false"
          elif docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
            echo "Image ${IMAGE} already exists — skipping build."
            SKIP="true"
          fi
          echo "skip=${SKIP}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.check.outputs.skip != 'true' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Compose image tags
        id: tags
        if: steps.check.outputs.skip != 'true'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TAG: ${{ steps.ver.outputs.tag }}
          TAG_BARE: ${{ steps.ver.outputs.tag_bare }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:latest"
            echo "${IMAGE_NAME}:${TAG}"
            echo "${IMAGE_NAME}:${TAG_BARE}"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              DH="docker.io/${DOCKERHUB_USERNAME}/juicefs"
              echo "${DH}:latest"
              echo "${DH}:${TAG}"
              echo "${DH}:${TAG_BARE}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Smoke-test gate (amd64). A green Docker build only proves the image
      # builds. This proves the three things the image actually promises:
      #   1. Started with no settings at all, it comes up serving S3.
      #   2. It creates the file system itself, so no console step is needed.
      #   3. Restarted on the same volumes, it does NOT format again. That is
      #      the dangerous one: a second format would orphan every object in
      #      the store, so it gets a test rather than a careful comment.
      # ---------------------------------------------------------------------
      - name: Build amd64 image for smoke test
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: juicefs:smoke-amd64
          cache-from: type=gha

      - name: Smoke test — bare start, self-format, and no re-format on restart
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VOL_META="$(mktemp -d)"
          VOL_DATA="$(mktemp -d)"
          cleanup() { docker logs juicefs-smoke || true; docker rm -f juicefs-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          # (1) No -e flags on purpose: this is the path a user takes who
          # installs the template and changes nothing.
          docker run -d --name juicefs-smoke -p 9000:9000 \
            -v "${VOL_META}:/config" -v "${VOL_DATA}:/data" \
            juicefs:smoke-amd64

          ok=""
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000 || true)"
            case "$code" in 200|403) ok=1; break ;; esac
            sleep 2
          done
          [ -n "$ok" ] || { echo "::error::S3 gateway never answered on port 9000"; exit 1; }

          # (2) The volume must exist in the metadata engine, not just "the
          # process is running".
          docker exec juicefs-smoke juicefs status sqlite3:///config/juicefs.db \
            || { echo "::error::No file system was created"; exit 1; }

          # A generated secret key must have been written down, otherwise a
          # user who left the field empty can never authenticate.
          docker exec juicefs-smoke test -s /config/.s3_root_password \
            || { echo "::error::No generated secret key was persisted"; exit 1; }

          # Record what the volume looks like now, to compare after the restart.
          BEFORE="$(docker exec juicefs-smoke juicefs status sqlite3:///config/juicefs.db | tr -d '[:space:]')"

          # (3) Restart on the same volumes. The UUID must survive; a new one
          # means the init script formatted over an existing file system.
          docker restart juicefs-smoke
          ok=""
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000 || true)"
            case "$code" in 200|403) ok=1; break ;; esac
            sleep 2
          done
          [ -n "$ok" ] || { echo "::error::Gateway did not come back after a restart"; exit 1; }

          AFTER="$(docker exec juicefs-smoke juicefs status sqlite3:///config/juicefs.db | tr -d '[:space:]')"
          if [ "${BEFORE}" != "${AFTER}" ]; then
            echo "::error::The file system changed across a restart — it was formatted again"
            exit 1
          fi
          echo "Smoke test passed."

      - name: Build and push multi-arch image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
