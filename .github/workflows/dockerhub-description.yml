# Push the README to the Docker Hub repo's Overview, on demand and nothing else.
#
# This is the only place the description is synced. The image build does not do
# it, so after a README change the Overview on Docker Hub stays as it was until
# this workflow runs.
#
# Manual only. It never builds, never pushes an image, and touches nothing but
# the description text on Docker Hub. Because it builds nothing, it also answers
# the question worth answering when the sync starts failing: a red run here means
# the credential is the problem, not the build.
name: Docker Hub description

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync README to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No gate and no continue-on-error: this workflow exists to make a failure
      # visible, so a missing secret or a refused login must turn the run red
      # instead of passing quietly.
      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/juicefs
          short-description: "The JuiceFS S3 gateway as a ready-to-run container for Unraid, with the file system created on first boot"
          enable-url-completion: true
