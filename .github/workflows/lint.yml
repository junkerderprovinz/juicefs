name: Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  # Required by reviewdog to post inline PR annotations (optional enhancement)
  pull-requests: read

env:
  # Opt into Node.js 24 for all JavaScript actions to silence the
  # deprecation warning about Node.js 20.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  hadolint:
    name: Lint Dockerfile (hadolint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          # DL3008: apt versions stay unpinned in a wrapper image that tracks upstream.
          # DL3009: the apt lists are removed with rm -rf /var/lib/apt/lists/*.
          ignore: DL3008,DL3009
          failure-threshold: warning

  shellcheck:
    name: Lint shell scripts (shellcheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Run shellcheck on all shell scripts
        run: |
          # The s6 run scripts have no .sh extension.
          SCRIPTS=$(find rootfs/ -type f \( -name "*.sh" -o -name "run" \))

          if [ -z "${SCRIPTS}" ]; then
            echo "No shell scripts found."
            exit 0
          fi

          echo "Checking the following scripts:"
          echo "${SCRIPTS}"
          echo "---"

          # shellcheck:
          #   -S warning: treat warnings as errors
          #   -x:         follow sourced files
          #   -e SC1091:  allow sourcing files not present at lint time
          # shellcheck disable=SC2086
          shellcheck -S warning -x -e SC1091 ${SCRIPTS}

          echo "All scripts passed shellcheck."

  yaml-lint:
    name: Lint YAML files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint on GitHub Actions workflows
        run: |
          yamllint -d '{
            extends: default,
            rules: {
              line-length: {max: 160},
              truthy: {allowed-values: ["true", "false", "on", "off", "yes", "no"]}
            }
          }' .github/workflows/

      - name: Validate YAML syntax
        run: |
          python3 -c "
          import yaml, sys, glob

          files = sorted(glob.glob('.github/workflows/*.yml') + glob.glob('.github/**/*.yaml', recursive=True))
          if not files:
              print('ERROR: no YAML files found, this check would pass without testing anything', file=sys.stderr)
              sys.exit(1)

          errors = []
          for f in files:
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
                  print(f'OK: {f}')
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')

          if errors:
              for err in errors:
                  print(f'ERROR: {err}', file=sys.stderr)
              sys.exit(1)
          print(f'{len(files)} YAML files parsed successfully.')
          "
